<!doctype html><html lang="de"><meta charset="utf-8"><title>Eule – isolierte Oberflächenprüfung</title><link rel="stylesheet" href="../../style.css"><style>body{background:#192331;color:#eee;font:16px sans-serif;padding:20px}button,input,select,textarea{font:inherit}#fixture{max-width:550px}button{padding:6px}#fixture p{line-height:1.5}</style>
<div id="fixture"><h1>Künstliche Eule-Oberflächenprüfung</h1><p>Keine SillyTavern-Installation. Kein Netzmodell. Alle Antworten und Speicherung sind lokale Testdoubles. Port 8004 bleibt unberührt.</p><p id="counts"></p><button id="chatA">Chat A</button><button id="chatB">Chat B</button><button id="branch">Kopierten Branch öffnen</button><button id="advance">Künstliche Szene fortsetzen</button><button id="reload">Neu laden</button></div>
<script type="module">
import {CONNECTION_KEY} from '../../src/connection.mjs';
const read=(k,f)=>JSON.parse(localStorage.getItem('fixture-'+k)||JSON.stringify(f));
let own=read('own',{enabled:true,profileId:'EULE',temperature:.7});let chosen='A';let calls=0,rpg=0;
const profile={id:'EULE',name:'Künstliches Eule-Profil – kein echtes Modell',model:'synthetic','api-url':'https://example.invalid/v1','secret-id':'test-reference'};
const c={characterId:0,characters:[{name:'Künstlicher Erzähler',avatar:'synthetic.png'}],extensionSettings:{[CONNECTION_KEY]:own},getRequestHeaders:()=>({}),saveSettingsDebounced:()=>localStorage.setItem('fixture-own',JSON.stringify(c.extensionSettings[CONNECTION_KEY])),loadWorldInfo:async()=>({entries:{}}),setExtensionPrompt:async()=>{},generate:async()=>{rpg++;c.chat.push({mes:'Mitsuki entdeckt die Nachricht am Fluss.',is_user:false});await c.saveMetadata();counts();return 'synthetic';},ConnectionManagerRequestService:{getProfile:()=>profile,getSupportedProfiles:()=>[profile],validateProfile:()=>({selected:'openai',source:'custom'}),sendRequest:async()=>{calls++;counts();return {choices:[{finish_reason:'stop',message:{content:'Eine unbekannte Botin bringt Mitsuki eine Nachricht zum Fluss. Die Botschaft verweist auf ein offenes Geheimnis.'}}]};}}};
function counts(){document.getElementById('counts').textContent=`Chat ${chosen} · simulierte Eule-Anfragen ${calls} · simulierte RPG-Generierungen ${rpg}`;}
function choose(id){chosen=id;const d=read(id,{metadata:{integrity:'synthetic-'+id},chat:[{mes:'Künstliche Szene: Mitsuki ist eine Spielerin; Sakura bleibt Rivalin. Naruto wartet am Fluss.',is_user:false}]});c.chatId='synthetic-'+id;c.chatMetadata=d.metadata;c.chat=d.chat;counts();}
c.saveMetadata=async()=>localStorage.setItem('fixture-'+chosen,JSON.stringify({metadata:c.chatMetadata,chat:c.chat}));
window.fetch=async(url)=>{if(url!=='/api/chats/get')throw Error('Unexpected fixture endpoint');const d=read(chosen,{metadata:{integrity:'synthetic-'+chosen}});return {ok:true,json:async()=>[{chat_metadata:d.metadata},...c.chat]};};
window.SillyTavern={getContext:()=>c};choose('A');
document.getElementById('chatA').onclick=()=>choose('A');document.getElementById('chatB').onclick=()=>choose('B');document.getElementById('branch').onclick=()=>{chosen='BRANCH';c.chatId='copied-branch';c.chatMetadata=structuredClone(c.chatMetadata);c.chatMetadata.integrity='other';c.saveMetadata();counts();};document.getElementById('advance').onclick=async()=>{c.chat.push({mes:'Die Szene geht weiter.',is_user:true});await c.saveMetadata();};document.getElementById('reload').onclick=()=>location.reload();
const {init}=await import('../../index.js');await init();
</script></html>
